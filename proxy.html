<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1020">
<meta name="color-scheme" content="dark">
<title>بروكسي تيليجرام</title>
<style>
  :root{
    --bg:#0a1020; --bg2:#0f1a36;
    --card:rgba(255,255,255,.045); --card-b:rgba(255,255,255,.09);
    --txt:#eaf0ff; --muted:#8c98b8; --dim:#5f6b8c;
    --blue:#2f8cff; --blue2:#1e6bff; --sky:#4fc3ff;
    --ok:#34d399; --warn:#fbbf24; --err:#f87171; --purple:#a78bfa;
    --r:22px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{
    min-height:100vh; color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;
    background:
      radial-gradient(900px 420px at 85% -5%,rgba(47,140,255,.28),transparent 60%),
      radial-gradient(700px 380px at 0% 10%,rgba(79,195,255,.12),transparent 60%),
      linear-gradient(180deg,var(--bg2),var(--bg) 45%);
    background-attachment:fixed;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:460px;margin:0 auto;padding:22px 16px 40px}
  svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

  /* ---------- Header ---------- */
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{
    width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#fff;font-size:21px;
    background:linear-gradient(135deg,var(--sky),var(--blue2));
    box-shadow:0 8px 24px -6px rgba(30,107,255,.7),inset 0 1px 0 rgba(255,255,255,.35);
  }
  .brand h1{font-size:18px;font-weight:800;letter-spacing:.2px}
  .brand p{font-size:11.5px;color:var(--muted);margin-top:2px}
  .icon-btn{
    width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:18px;cursor:pointer;
    color:var(--muted);background:var(--card);border:1px solid var(--card-b);transition:.2s;
  }
  .icon-btn:hover{color:var(--txt);background:rgba(255,255,255,.08)}
  .icon-btn:active{transform:scale(.94)}
  .spin svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(-360deg)}}

  /* ---------- Hero (quick connect) ---------- */
  .hero{
    position:relative;overflow:hidden;border-radius:28px;padding:22px 20px;margin-bottom:18px;text-align:center;
    background:linear-gradient(160deg,rgba(47,140,255,.22),rgba(30,107,255,.06) 60%),var(--card);
    border:1px solid rgba(79,195,255,.25);
    box-shadow:0 20px 50px -20px rgba(30,107,255,.55);
  }
  .hero::before{
    content:"";position:absolute;inset:-40% -20% auto auto;width:260px;height:260px;border-radius:50%;
    background:radial-gradient(circle,rgba(79,195,255,.25),transparent 65%);pointer-events:none;
  }
  .orb{
    position:relative;width:84px;height:84px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;font-size:36px;color:#fff;
    background:linear-gradient(135deg,var(--sky),var(--blue2));
    box-shadow:0 0 0 8px rgba(47,140,255,.12),0 0 0 18px rgba(47,140,255,.06),0 14px 34px -8px rgba(30,107,255,.8);
  }
  .orb::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(79,195,255,.5);animation:ring 2.4s ease-out infinite}
  @keyframes ring{from{transform:scale(.92);opacity:.9}to{transform:scale(1.35);opacity:0}}
  .hero h2{font-size:17px;font-weight:800;margin-bottom:4px}
  .hero .sub{font-size:12.5px;color:var(--muted);margin-bottom:16px}
  .btn-main{
    display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:15px;border-radius:18px;
    font-size:16px;font-weight:800;color:#fff;text-decoration:none;cursor:pointer;border:0;
    background:linear-gradient(135deg,var(--blue),var(--blue2));
    box-shadow:0 12px 28px -10px rgba(30,107,255,.9),inset 0 1px 0 rgba(255,255,255,.3);
    transition:.2s;
  }
  .btn-main:hover{filter:brightness(1.08)}
  .btn-main:active{transform:scale(.98)}
  .btn-main svg{font-size:20px}

  /* ---------- Status row ---------- */
  .status{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;font-size:12px}
  .pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font-weight:600;
        background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.25);color:var(--ok)}
  .pill.stale{background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.3);color:var(--warn)}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:blink 1.8s infinite}
  @keyframes blink{50%{opacity:.35}}
  .ago{color:var(--dim)}

  /* ---------- Filter ---------- */
  .seg{display:flex;gap:4px;padding:4px;border-radius:16px;margin-bottom:14px;background:var(--card);border:1px solid var(--card-b)}
  .seg button{
    flex:1;padding:9px 6px;border:0;border-radius:12px;background:transparent;color:var(--muted);
    font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:.2s;
  }
  .seg button.on{color:#fff;background:linear-gradient(135deg,var(--blue),var(--blue2));box-shadow:0 6px 16px -8px rgba(30,107,255,.9)}

  /* ---------- Server cards ---------- */
  .list{display:grid;gap:10px}
  .item{
    display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:var(--r);
    background:var(--card);border:1px solid var(--card-b);
    animation:rise .4s ease both;transition:border-color .2s,background .2s;
  }
  .item:hover{border-color:rgba(79,195,255,.35);background:rgba(255,255,255,.065)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .ico{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:21px}
  .ico.mt{background:rgba(79,195,255,.13);color:var(--sky)}
  .ico.wp{background:rgba(167,139,250,.14);color:var(--purple)}
  .meta{flex:1;min-width:0}
  .row1{display:flex;align-items:center;gap:8px;margin-bottom:3px}
  .name{font-size:14px;font-weight:800}
  .tag{font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;letter-spacing:.3px}
  .tag.mt{color:var(--sky);background:rgba(79,195,255,.12)}
  .tag.wp{color:var(--purple);background:rgba(167,139,250,.14)}
  .addr{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--muted);
        direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn{
    flex:none;display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:14px;
    font-size:13.5px;font-weight:800;color:#fff;text-decoration:none;
    background:linear-gradient(135deg,var(--blue),var(--blue2));
    box-shadow:0 8px 18px -8px rgba(30,107,255,.9),inset 0 1px 0 rgba(255,255,255,.25);transition:.2s;
  }
  .btn:hover{filter:brightness(1.1)}
  .btn:active{transform:scale(.95)}

  /* ---------- Skeleton ---------- */
  .sk{height:74px;border-radius:var(--r);border:1px solid var(--card-b);
      background:linear-gradient(100deg,rgba(255,255,255,.03) 30%,rgba(255,255,255,.09) 50%,rgba(255,255,255,.03) 70%);
      background-size:200% 100%;animation:shine 1.2s linear infinite}
  @keyframes shine{to{background-position:-200% 0}}

  /* ---------- Empty / error ---------- */
  .state{text-align:center;padding:34px 20px;border-radius:26px;background:var(--card);border:1px solid var(--card-b)}
  .state.err{background:rgba(248,113,113,.07);border-color:rgba(248,113,113,.25)}
  .state .big{width:58px;height:58px;margin:0 auto 12px;border-radius:18px;display:grid;place-items:center;font-size:26px;background:rgba(255,255,255,.06);color:var(--muted)}
  .state.err .big{color:var(--err);background:rgba(248,113,113,.12)}
  .state p{font-size:13.5px;color:var(--muted);margin-bottom:16px;line-height:1.7}
  .state .btn{border:0;cursor:pointer;font-family:inherit}

  /* ---------- Footer / toast ---------- */
  .note{margin-top:26px;text-align:center;font-size:11.5px;line-height:1.8;color:var(--dim);display:flex;gap:6px;justify-content:center;align-items:flex-start}
  .note svg{margin-top:3px}
  .toast{
    position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;
    padding:11px 18px;border-radius:14px;font-size:13px;font-weight:600;color:#fff;pointer-events:none;
    background:rgba(20,30,60,.95);border:1px solid var(--card-b);backdrop-filter:blur(10px);transition:.3s;z-index:9;white-space:nowrap
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg></div>
      <div>
        <h1>بروكسي تيليجرام</h1>
        <p>اتصال سريع بنقرة واحدة</p>
      </div>
    </div>
    <button class="icon-btn" id="refreshBtn" aria-label="تحديث القائمة">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
    </button>
  </header>

  <div id="app"></div>

  <p class="note">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span>هذه خوادم عامة مجانية وغير مملوكة لنا. تجنّب استخدامها مع الحسابات أو البيانات الحساسة.</span>
  </p>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  var DATA_FILE   = 'proxies.json';
  var REFRESH_MS  = 120000;            // تحديث تلقائي كل دقيقتين
  var STALE_HOURS = 6;                 // بعدها تظهر تنبيه "قد تكون القائمة قديمة"
  var SAFE_URL    = /^(tg:\/\/(proxy|socks)\?|https:\/\/t\.me\/(proxy|socks)\?)/i;

  var app = document.getElementById('app');
  var refreshBtn = document.getElementById('refreshBtn');
  var toastEl = document.getElementById('toast');
  var filter = 'all';
  var cache = null;
  var toastTimer;

  /* ---------- أيقونات ثابتة (من تصميمنا نحن) ---------- */
  var ICON = {
    bolt:  '<svg viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>',
    plug:  '<svg viewBox="0 0 24 24"><path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0V8zM12 18v4"/></svg>',
    shield:'<svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>',
    globe: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>',
    server:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01"/></svg>',
    wifi:  '<svg viewBox="0 0 24 24"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 20h.01"/></svg>',
    retry: '<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>'
  };

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function svg(key) {                 // innerHTML هنا لمحتوى ثابت فقط
    var s = el('span'); s.innerHTML = ICON[key]; return s.firstChild;
  }
  function withIcon(node, key, label) {
    node.appendChild(svg(key));
    if (label) node.appendChild(document.createTextNode(label));
    return node;
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }

  function ago(iso) {
    var t = Date.parse(iso);
    if (isNaN(t)) return '';
    var m = Math.max(0, Math.round((Date.now() - t) / 60000));
    if (m < 1) return 'تم التحديث الآن';
    if (m < 60) return 'آخر تحديث منذ ' + m + ' دقيقة';
    var h = Math.round(m / 60);
    if (h < 24) return 'آخر تحديث منذ ' + h + ' ساعة';
    return 'آخر تحديث منذ ' + Math.round(h / 24) + ' يوم';
  }
  function isStale(iso) {
    var t = Date.parse(iso);
    return !isNaN(t) && (Date.now() - t) > STALE_HOURS * 3600000;
  }

  /* ---------- هياكل التحميل ---------- */
  function showSkeleton() {
    app.replaceChildren();
    var hero = el('div', 'sk'); hero.style.height = '210px'; hero.style.marginBottom = '18px'; hero.style.borderRadius = '28px';
    app.appendChild(hero);
    var list = el('div', 'list');
    for (var i = 0; i < 4; i++) list.appendChild(el('div', 'sk'));
    app.appendChild(list);
  }

  function showState(iconKey, text, isErr) {
    app.replaceChildren();
    var box = el('div', 'state' + (isErr ? ' err' : ''));
    var big = el('div', 'big'); big.appendChild(svg(iconKey));
    box.appendChild(big);
    box.appendChild(el('p', null, text));
    var b = el('button', 'btn');
    withIcon(b, 'retry', 'إعادة المحاولة');
    b.addEventListener('click', load);
    box.appendChild(b);
    app.appendChild(box);
  }

  /* ---------- العرض ---------- */
  function render() {
    var all = (cache.proxies || []).filter(function (p) {
      return p && SAFE_URL.test(String(p.tg_url || ''));
    });
    if (!all.length) { showState('server', 'لا توجد خوادم متاحة حاليًا.'); return; }

    app.replaceChildren();

    /* بطاقة الاتصال السريع */
    var hero = el('section', 'hero');
    var orb = el('div', 'orb'); orb.appendChild(svg('shield'));
    hero.appendChild(orb);
    hero.appendChild(el('h2', null, 'اتصال سريع'));
    hero.appendChild(el('div', 'sub', 'اتصل بأول خادم متاح بضغطة واحدة'));
    var main = el('a', 'btn-main');
    main.href = all[0].tg_url;
    withIcon(main, 'bolt', 'اتصل الآن');
    main.addEventListener('click', function () { toast('جاري فتح تيليجرام...'); });
    hero.appendChild(main);
    app.appendChild(hero);

    /* شريط الحالة */
    var st = el('div', 'status');
    var pill = el('span', 'pill' + (isStale(cache.updated_at) ? ' stale' : ''));
    pill.appendChild(el('span', 'dot'));
    pill.appendChild(document.createTextNode(
      isStale(cache.updated_at) ? 'قد تكون القائمة قديمة' : all.length + ' خادم متاح'));
    st.appendChild(pill);
    var a = ago(cache.updated_at);
    if (a) st.appendChild(el('span', 'ago', a));
    app.appendChild(st);

    /* الفلتر (يظهر فقط إذا وُجد أكثر من نوع) */
    var hasMt = all.some(function (p) { return p.type !== 'webproxy'; });
    var hasWp = all.some(function (p) { return p.type === 'webproxy'; });
    if (hasMt && hasWp) {
      var seg = el('div', 'seg');
      [['all', 'الكل'], ['mtproto', 'MTProto'], ['webproxy', 'WebProxy']].forEach(function (f) {
        var b = el('button', filter === f[0] ? 'on' : '', f[1]);
        b.addEventListener('click', function () { filter = f[0]; render(); });
        seg.appendChild(b);
      });
      app.appendChild(seg);
    } else {
      filter = 'all';
    }

    var shown = all.filter(function (p) {
      return filter === 'all' || (filter === 'webproxy') === (p.type === 'webproxy');
    });

    /* قائمة الخوادم */
    var list = el('div', 'list');
    shown.forEach(function (p, i) {
      var web = p.type === 'webproxy';
      var item = el('div', 'item');
      item.style.animationDelay = Math.min(i, 12) * 45 + 'ms';

      var ico = el('div', 'ico ' + (web ? 'wp' : 'mt'));
      ico.appendChild(svg(web ? 'globe' : 'shield'));

      var meta = el('div', 'meta');
      var row = el('div', 'row1');
      row.appendChild(el('span', 'name', 'خادم ' + (i + 1)));
      row.appendChild(el('span', 'tag ' + (web ? 'wp' : 'mt'), web ? 'WEB' : 'MTPROTO'));
      meta.appendChild(row);
      meta.appendChild(el('div', 'addr', (p.server || '') + ':' + (p.port || '443')));

      var btn = el('a', 'btn');
      btn.href = p.tg_url;
      withIcon(btn, 'plug', 'اتصال');
      btn.addEventListener('click', function () { toast('جاري فتح تيليجرام...'); });

      item.appendChild(ico); item.appendChild(meta); item.appendChild(btn);
      list.appendChild(item);
    });
    app.appendChild(list);
  }

  /* ---------- قراءة الملف ---------- */
  var loading = false;
  function load() {
    if (loading) return;
    loading = true;
    refreshBtn.classList.add('spin');
    if (!cache) showSkeleton();

    fetch(DATA_FILE + '?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) {
        if (!data || !Array.isArray(data.proxies)) throw new Error('bad format');
        cache = data;
        render();
      })
      .catch(function () {
        if (cache) { toast('تعذّر التحديث، تُعرض آخر قائمة محفوظة'); }
        else { showState('wifi', 'تعذّر تحميل قائمة الخوادم. تأكد من تشغيل fetch.php مرة واحدة على الأقل.', true); }
      })
      .then(function () {
        loading = false;
        refreshBtn.classList.remove('spin');
      });
  }

  refreshBtn.addEventListener('click', load);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
  setInterval(load, REFRESH_MS);
  load();
})();
</script>
</body>
</html>
