<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفوان جمعه | Deep Space</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Space+Grotesk:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: #020617;
            color: white;
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            margin: 0;
        }

        /* Star Background Effect */
        .stars-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            z-index: -2;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle var(--duration) infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Nebula Glow */
        .nebula {
            position: fixed;
            width: 600px; height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.2) 0%, transparent 70%);
            filter: blur(60px);
            z-index: -1;
            animation: move 20s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-10%, -10%); }
            to { transform: translate(10%, 10%); }
        }

        /* Card Style */
        .space-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 40px;
            padding: 50px 30px;
            width: 90%;
            max-width: 420px;
            backdrop-filter: blur(15px);
            text-align: center;
            box-shadow: 0 0 40px rgba(139, 92, 246, 0.1);
        }

        .profile-ring {
            width: 110px; height: 110px;
            margin: 0 auto 25px;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            position: relative;
        }

        .profile-ring::before {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            border: 1px dashed rgba(139, 92, 246, 0.4);
            animation: spin 10s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .btn-space {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 100%;
        }

        .btn-space:hover {
            background: rgba(139, 92, 246, 0.15);
            border-color: #8b5cf6;
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.2);
        }

        .btn-space i {
            font-size: 20px;
            color: #c084fc;
        }

        .btn-location {
            background: rgba(139, 92, 246, 0.1);
            border-color: rgba(139, 92, 246, 0.4);
        }

        .coordinate-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 10px;
            color: #a78bfa;
            letter-spacing: 3px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="stars-container" id="stars"></div>
    <div class="nebula" style="top: -100px; right: -100px;"></div>
    <div class="nebula" style="bottom: -100px; left: -100px; background: radial-gradient(circle, rgba(236, 72, 153, 0.15) 0%, transparent 70%);"></div>

    <div class="space-card">
        <!-- Profile -->
        <div class="profile-ring">
            <div class="w-full h-full bg-slate-950 rounded-full flex items-center justify-center text-4xl">
                <i class="fas fa-user-astronaut text-slate-400"></i>
            </div>
        </div>

        <h1 class="text-4xl font-black mb-2 tracking-tight">صفوان جمعه</h1>
        <p class="text-sm text-purple-300 mb-8 font-light">Network Engineer | Cyber Sentinel</p>

        <!-- Actions -->
        <div class="flex flex-col">
            <a href="tel:+9647709739636" class="btn-space">
                <i class="fas fa-headset"></i>
                <span class="font-bold flex-grow text-right">اتصال مباشر</span>
            </a>

            <a href="https://wa.me/+9647709739636" target="_blank" class="btn-space">
                <i class="fab fa-whatsapp"></i>
                <span class="font-bold flex-grow text-right">مراسلة فورية</span>
            </a>

            <a href="https://www.facebook.com/sszzo" target="_blank" class="btn-space">
                <i class="fab fa-facebook-messenger"></i>
                <span class="font-bold flex-grow text-right">فيسبوك</span>
            </a>

            <a href="https://instagram.com/e_0_w" target="_blank" class="btn-space">
                <i class="fab fa-instagram"></i>
                <span class="font-bold flex-grow text-right">إنستغرام</span>
            </a>

            <!-- الموقع في نهاية القائمة -->
            <a href="https://maps.app.goo.gl/MBNDKYY4rWUwZ5eM6?g_st=ac" target="_blank" class="btn-space btn-location">
                <i class="fas fa-map-marker-alt"></i>
                <span class="font-bold flex-grow text-right">موقع الشبكة (Maps)</span>
            </a>
        </div>

        <div class="coordinate-text uppercase">Sector: Nineveh / Iraq</div>
    </div>

    <script>
        // Generate random stars
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3 + 'px';
            star.style.width = size;
            star.style.height = size;
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            starsContainer.appendChild(star);
        }
    </script>
</body>
</html>
