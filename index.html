  <style>
    /* الأنماط المخصصة التي لا يمكن تحقيقها بـ Tailwind وحدها */
    :root {
      --bg-primary: #0a0a0a;
      --bg-secondary: #161616;
      --backtrack-blue: #00aaff;
      --backtrack-purple: #6600ff;
      --backtrack-cyan: #00ffff;
      --neon-red: #ff0040;
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
      background: var(--bg-primary);
    }
    
    /* Animated Background */
    .bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      background: 
        radial-gradient(circle at 20% 80%, var(--backtrack-blue) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, var(--backtrack-purple) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, var(--backtrack-cyan) 0%, transparent 50%);
      opacity: 0.03;
      animation: pulse 4s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { opacity: 0.03; }
      100% { opacity: 0.08; }
    }
    
    /* Matrix Rain Effect */
    #matrix-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      opacity: 2.15; /* تم زيادة الشفافية لإظهار الأكواد أكثر */
    }
    
    /* Glitch Effect */
    .glitch {
      position: relative;
    }
    .glitch::before,
    .glitch::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .glitch::before {
      animation: glitch-1 0.5s infinite;
      color: var(--backtrack-purple);
      z-index: -1;
    }
    .glitch::after {
      animation: glitch-2 0.5s infinite;
      color: var(--neon-red);
      z-index: -2;
    }
    @keyframes glitch-1 {
      0%, 14%, 15%, 49%, 50%, 99%, 100% { transform: translate(0); }
      15%, 49% { transform: translate(-2px, 2px); }
    }
    @keyframes glitch-2 {
      0%, 20%, 21%, 62%, 63%, 99%, 100% { transform: translate(0); }
      21%, 62% { transform: translate(2px, -2px); }
    }

    /* Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-secondary);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--backtrack-blue);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--backtrack-purple);
    }
  </style>
</head>
