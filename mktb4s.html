<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مكتب علوم حاسوب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFFFFF;
    --panel: #F6F7FB;
    --line: #E7E9F2;
    --ink: #1C2033;
    --ink-soft: #5B6178;
    --ink-faint: #9FA4B8;
    --indigo: #4A5FE8;
    --indigo-deep: #3446C4;
    --teal: #17B3A3;
    --teal-deep: #0E8C7F;
    --wa-ink: #6B7280;
    --font-display: 'Tajawal', system-ui, sans-serif;
    --font-body: 'IBM Plex Sans Arabic', system-ui, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  *{ box-sizing: border-box; }
  html{ height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }

  body{
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 36px 22px;
  }

  .stage{
    width: 100%;
    max-width: 380px;
    text-align: center;
  }

  /* ---- Hero mark: node graph ---- */
  .mark-wrap{
    position: relative;
    width: 148px;
    height: 148px;
    margin: 0 auto 26px;
  }

  .mark-glow{
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #EEF1FF, #FFFFFF 70%);
    box-shadow: 0 24px 44px -20px rgba(74,95,232,0.35);
  }

  .mark-wrap svg{
    position: relative;
    width: 100%;
    height: 100%;
  }

  @media (prefers-reduced-motion: no-preference){
    .node{ animation: pulse 3.2s ease-in-out infinite; }
    .node.n2{ animation-delay: .4s; }
    .node.n3{ animation-delay: .8s; }
    .node.n4{ animation-delay: 1.2s; }
    .node.n5{ animation-delay: 1.6s; }
    @keyframes pulse{
      0%, 100%{ opacity: 1; }
      50%{ opacity: .55; }
    }
  }

  h1{
    margin: 0 0 10px;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 30px;
    letter-spacing: -0.01em;
    color: var(--ink);
  }

  .tagline{
    margin: 0 auto 30px;
    max-width: 280px;
    font-size: 14.5px;
    line-height: 1.85;
    color: var(--ink-soft);
  }

  .actions{
    display: flex;
    flex-direction: column;
    gap: 13px;
  }

  .action{
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 16px 20px;
    border-radius: 16px;
    text-decoration: none;
    font-family: var(--font-body);
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .action:active{ transform: scale(0.98); }

  .action.telegram{
    background: linear-gradient(135deg, var(--indigo), var(--indigo-deep));
    color: #FFFFFF;
    box-shadow: 0 16px 30px -14px rgba(74,95,232,0.55);
  }
  .action.telegram:hover{ box-shadow: 0 18px 34px -12px rgba(74,95,232,0.6); }

  .action.whatsapp{
    background: linear-gradient(135deg, var(--teal), var(--teal-deep));
    color: #FFFFFF;
    box-shadow: 0 16px 30px -14px rgba(23,179,163,0.5);
    text-decoration: none;
  }
  .action.whatsapp:hover{ box-shadow: 0 18px 34px -12px rgba(23,179,163,0.55); }

  .icon-badge{
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-badge.telegram{ background: rgba(255,255,255,0.18); }
  .icon-badge.whatsapp{ background: rgba(255,255,255,0.18); }
  .icon-badge svg{ width: 21px; height: 21px; }

  .action-text{
    display: flex;
    flex-direction: column;
    gap: 2px;
    text-align: right;
  }

  .action-title{ font-size: 15.5px; font-weight: 700; }
  .action.telegram .action-sub{ color: rgba(255,255,255,0.78); }
  .action.whatsapp .action-sub{ color: rgba(255,255,255,0.78); }
  .action-sub{ font-size: 12.5px; color: var(--ink-faint); }

  .action-arrow{ margin-inline-start: auto; flex-shrink: 0; color: rgba(255,255,255,0.85); }

  footer{
    margin-top: 30px;
    font-size: 12px;
    color: var(--ink-faint);
  }

  a.action:focus-visible{
    outline: 2px solid var(--indigo);
    outline-offset: 3px;
  }
</style>
</head>
<body>

<div class="stage">

  <div class="mark-wrap">
    <div class="mark-glow"></div>
    <svg viewBox="0 0 148 148" fill="none">
      <g stroke="#C9D1F5" stroke-width="1.6">
        <line x1="74" y1="74" x2="74" y2="30"/>
        <line x1="74" y1="74" x2="112" y2="52"/>
        <line x1="74" y1="74" x2="112" y2="96"/>
        <line x1="74" y1="74" x2="74" y2="118"/>
        <line x1="74" y1="74" x2="36" y2="96"/>
        <line x1="74" y1="74" x2="36" y2="52"/>
      </g>
      <circle class="node" cx="74" cy="74" r="9" fill="#4A5FE8"/>
      <circle class="node n2" cx="74" cy="30" r="6" fill="#17B3A3"/>
      <circle class="node n3" cx="112" cy="52" r="6" fill="#4A5FE8"/>
      <circle class="node n4" cx="112" cy="96" r="6" fill="#17B3A3"/>
      <circle class="node n5" cx="74" cy="118" r="6" fill="#4A5FE8"/>
      <circle class="node n2" cx="36" cy="96" r="6" fill="#4A5FE8"/>
      <circle class="node n3" cx="36" cy="52" r="6" fill="#17B3A3"/>
    </svg>
  </div>

  <h1>مكتب علوم حاسوب</h1>


  <div class="actions">

      <span class="action-text">
        <span class="action-title">تيليجرام</span>

      <svg class="action-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none">

      <span class="action-text">
        <span class="action-title">واتساب</span>

      <svg class="action-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>

  </div>

  <footer>نسعد بتواصلكم معنا</footer>
</div>

</body>
</html>
